
[project]
name = "kintsutech-backend"
version = "0.1.0"
description = "Autonomous API Resilience Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "networkx>=3.2.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.39.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
